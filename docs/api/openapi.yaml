    "/fotos/{nombre}": {
      "get": {
        "tags": [
          "Identidad"
        ],
        "summary": "Foto de perfil pública (catálogo, reseñas, panel)",
        "description": "El nombre es un UUID con su extensión; cualquier otro valor da 404. Se puede guardar en caché un año.",
        "parameters": [
          {
            "in": "path",
            "name": "nombre",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[0-9a-f-]{36}.(jpg|png|webp)$"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Bytes de la imagen",
            "content": {
              "image/jpeg": {
                "schema": {
                  "type": "string",
                  "format": "binary"
                }
              },
              "image/png": {
                "schema": {
                  "type": "string",
                  "format": "binary"
                }
              },
              "image/webp": {
                "schema": {
                  "type": "string",
                  "format": "binary"
                }
              }
            }
          },
          "404": {
            "description": "La foto no existe (NO_ENCONTRADO)",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorApi"
                }
              }
            }
          },
          "500": {
            "$ref": "#/components/responses/ErrorInterno"
