  "paths": {
    "/admin/cursos": {
      "get": {
        "tags": [
          "Administración"
        ],
        "summary": "Cursos pendientes de revisión (ADMIN)",
        "description": "Ordenados del más antiguo al más reciente. Un parámetro de consulta desconocido o un `estado` distinto de EN_REVISION dan 400.",
        "security": [
          {
            "bearer": []
          }
        ],
        "parameters": [
          {
            "in": "query",
            "name": "estado",
            "schema": {
              "type": "string",
              "enum": [
                "EN_REVISION"
              ],
              "default": "EN_REVISION"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Correcto",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "items"
                  ],
                  "properties": {
                    "items": {
                      "type": "array",
                      "items": {
                        "$ref": "#/components/schemas/CursoResumen"
                      }
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Filtro inválido (SOLICITUD_INVALIDA)",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorApi"
                }
              }
            }
          },
          "401": {
            "description": "Sesión ausente, inválida o revocada",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorApi"
                }
              }
            }
          },
          "403": {
            "description": "No es administrador (SIN_PERMISO)",
            "content": {
