  "paths": {
    "/admin/cursos": {
      "get": {
        "tags": [
          "Administración"
        ],
        "summary": "Cursos de un estado para Revisión de cursos (ADMIN)",
        "description": "EN_REVISION, del más antiguo al más reciente; los demás estados, el modificado más recientemente primero. Como mucho 200. `conteos` trae cuántos cursos hay en cada estado (para las pestañas). Un parámetro de consulta desconocido o un `estado` fuera de la lista dan 400.",
        "security": [
          {
            "bearer": []
          }
        ],
        "parameters": [
          {
            "in": "query",
            "name": "estado",
            "schema": {
              "type": "string",
              "enum": [
                "EN_REVISION",
                "PUBLICADO",
                "SUSPENDIDO",
                "RECHAZADO",
                "BORRADOR"
              ],
              "default": "EN_REVISION"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Correcto",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "items",
                    "conteos"
                  ],
                  "properties": {
                    "items": {
                      "type": "array",
                      "items": {
                        "$ref": "#/components/schemas/CursoRevision"
                      }
                    },
                    "conteos": {
                      "type": "object",
                      "required": [
                        "EN_REVISION",
                        "PUBLICADO",
                        "SUSPENDIDO",
                        "RECHAZADO",
                        "BORRADOR"
                      ],
                      "properties": {
                        "EN_REVISION": {
                          "type": "integer",
                          "minimum": 0
                        },
                        "PUBLICADO": {
                          "type": "integer",
                          "minimum": 0
                        },
                        "SUSPENDIDO": {
                          "type": "integer",
                          "minimum": 0
                        },
                        "RECHAZADO": {
                          "type": "integer",
                          "minimum": 0
                        },
                        "BORRADOR": {
                          "type": "integer",
                          "minimum": 0
                        }
                      }
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Filtro inválido (SOLICITUD_INVALIDA)",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorApi"
                }
              }
            }
          },
          "401": {
            "description": "Sesión ausente, inválida o revocada",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorApi"
                }
              }
            }
          },
          "403": {
            "description": "No es administrador (SIN_PERMISO)",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorApi"
                }
              }
            }
          },
          "500": {
            "$ref": "#/components/responses/ErrorInterno"
          }
        }
      }
    },
    "/admin/cursos/{id}": {
      "get": {
        "tags": [
          "Administración"
        ],
        "summary": "Detalle privado, incluso si ya fue decidido (ADMIN)",
        "security": [
          {
            "bearer": []
          }
        ],
        "parameters": [
          {
            "in": "path",
            "name": "id",
            "required": true,
            "description": "Entero decimal canónico de 1 a 2 147 483 647: solo dígitos, sin signo, sin ceros a la izquierda, sin espacios, sin parte decimal, exponente ni hexadecimal (`007`, `+7`, ` 7 `, `7.0`, `1e3` y `0x10` se rechazan). Si no cumple, responde 400 SOLICITUD_INVALIDA (\"Revisa los datos enviados.\") con `detalles: [{ campo: \"id\", mensaje: \"Debe ser un entero positivo en decimal.\" }]`, o con el mensaje \"Es demasiado grande.\" si tiene 10 cifras y supera 2 147 483 647. En las operaciones con sesión, el 401 y el 403 se comprueban antes.",
            "schema": {
              "type": "integer",
              "format": "int32",
              "minimum": 1,
              "maximum": 2147483647
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Curso completo, directamente en la raíz",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CursoDetalle"
                }
              }
            }
          },
          "400": {
            "description": "`id` de la ruta inválido (SOLICITUD_INVALIDA, con el detalle en el campo `id`)",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorApi"
                }
              }
            }
          },
          "401": {
            "description": "Sesión ausente, inválida o revocada",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorApi"
                }
              }
            }
          },
          "403": {
            "description": "No es administrador (SIN_PERMISO)",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorApi"
                }
              }
            }
          },
          "404": {
            "description": "El curso no existe (NO_ENCONTRADO)",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorApi"
                }
              }
            }
          },
          "500": {
            "$ref": "#/components/responses/ErrorInterno"
          }
        }
      }
    },
    "/admin/cursos/{id}/suspension": {
      "post": {
        "tags": [
          "Administración"
        ],
        "summary": "Suspender un curso publicado (ADMIN)",
        "description": "PUBLICADO → SUSPENDIDO con el motivo y la confirmación explícita `confirmo: true`. Sale del catálogo, sus inscritos no pueden abrirlo (lo ven marcado como suspendido en Mi aprendizaje y conservan su progreso) y el docente no puede editarlo. Avisa al docente por correo. Queda en la auditoría con el administrador como autor.",
        "security": [
          {
            "bearer": []
          }
        ],
        "parameters": [
          {
            "in": "path",
            "name": "id",
            "required": true,
            "description": "Entero decimal canónico de 1 a 2 147 483 647: solo dígitos, sin signo, sin ceros a la izquierda, sin espacios, sin parte decimal, exponente ni hexadecimal (`007`, `+7`, ` 7 `, `7.0`, `1e3` y `0x10` se rechazan). Si no cumple, responde 400 SOLICITUD_INVALIDA (\"Revisa los datos enviados.\") con `detalles: [{ campo: \"id\", mensaje: \"Debe ser un entero positivo en decimal.\" }]`, o con el mensaje \"Es demasiado grande.\" si tiene 10 cifras y supera 2 147 483 647. En las operaciones con sesión, el 401 y el 403 se comprueban antes.",
            "schema": {
              "type": "integer",
              "format": "int32",
              "minimum": 1,
              "maximum": 2147483647
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "motivo",
                  "confirmo"
                ],
                "properties": {
                  "motivo": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 300,
                    "description": "Se recortan los espacios de los extremos."
                  },
                  "confirmo": {
                    "type": "boolean",
                    "enum": [
                      true
                    ]
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Curso completo, directamente en la raíz",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CursoDetalle"
                }
              }
            }
          },
          "400": {
            "description": "Motivo vacío o largo, sin confirmar, o `id` de la ruta inválido (SOLICITUD_INVALIDA, con el detalle en el campo `id`). También, sin detalles, si el cuerpo no es un JSON válido (SOLICITUD_INVALIDA)",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorApi"
                }
              }
            }
          },
          "401": {
            "description": "Sesión ausente, inválida o revocada",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorApi"
                }
              }
            }
          },
          "403": {
            "description": "No es administrador (SIN_PERMISO)",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorApi"
                }
              }
            }
          },
