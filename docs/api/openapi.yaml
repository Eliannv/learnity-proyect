    "/auth/registro": {
      "post": {
        "tags": [
          "Identidad"
        ],
        "summary": "RF-01 · Crear cuenta (rol ESTUDIANTE) y abrir sesión",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "nombres",
                  "apellidos",
                  "correo",
                  "contrasena"
                ],
                "properties": {
                  "nombres": {
                    "type": "string",
                    "example": "Rosa",
                    "maxLength": 80
                  },
                  "apellidos": {
                    "type": "string",
                    "example": "Vera Chávez",
                    "maxLength": 80
                  },
                  "correo": {
                    "type": "string",
                    "format": "email",
                    "example": "rosa.vera@correo.com"
                  },
                  "contrasena": {
                    "type": "string",
                    "minLength": 15,
                    "description": "Mínimo 15 caracteres y máximo 72 bytes UTF-8 (límite de bcrypt), sin reglas de composición. Se rechazan contraseñas comunes, basadas en el nombre o el correo, y las expuestas en filtraciones (Have I Been Pwned, k-anonimato)."
                  }
                }
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Cuenta creada y sesión abierta",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "accessToken": {
                      "type": "string",
                      "description": "JWT de 15 minutos. Guardarlo SOLO en memoria y enviarlo como Authorization: Bearer <token>."
                    },
                    "expiraEn": {
                      "type": "string",
                      "format": "date-time"
                    },
                    "usuario": {
                      "type": "object",
                      "properties": {
                        "idUsuario": {
                          "type": "integer",
                          "example": 3
                        },
                        "idPersona": {
                          "type": "integer",
                          "example": 3
                        },
                        "nombres": {
                          "type": "string",
                          "example": "Rosa"
                        },
                        "apellidos": {
                          "type": "string",
                          "example": "Vera Chávez"
                        },
                        "correo": {
                          "type": "string",
                          "example": "rosa.vera@correo.com"
                        },
                        "fotoUrl": {
                          "type": "string",
                          "nullable": true,
                          "example": null
                        },
                        "roles": {
                          "type": "array",
                          "items": {
                            "type": "string",
                            "enum": [
                              "ESTUDIANTE",
                              "DOCENTE",
                              "ADMIN"
                            ]
                          }
                        }
                      }
                    }
                  }
                }
              }
            },
            "headers": {
              "Set-Cookie": {
                "description": "`learnity_rt` (refresh token opaco, HttpOnly, SameSite=Lax, Path=/api/auth, Secure en HTTPS) y `XSRF-TOKEN` (token CSRF legible por JavaScript).",
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "400": {
