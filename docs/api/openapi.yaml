    "/auth/registro": {
      "post": {
        "tags": [
          "Identidad"
        ],
        "summary": "RF-01 · Crear cuenta (rol ESTUDIANTE) y abrir sesión",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "nombres",
                  "apellidos",
                  "correo",
                  "contrasena"
                ],
                "properties": {
                  "nombres": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 80,
                    "example": "Rosa",
                    "description": "No admite el carácter NUL (U+0000): 400 SOLICITUD_INVALIDA con el detalle del campo."
                  },
                  "apellidos": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 80,
                    "example": "Vera Chávez",
                    "description": "No admite el carácter NUL (U+0000): 400 SOLICITUD_INVALIDA con el detalle del campo."
                  },
                  "correo": {
                    "type": "string",
                    "format": "email",
                    "maxLength": 120,
                    "example": "rosa.vera@correo.com",
                    "description": "Se recortan los espacios y se pasa a minúsculas antes de validar."
                  },
                  "contrasena": {
                    "type": "string",
                    "minLength": 15,
                    "description": "Mínimo 15 caracteres y máximo 72 bytes UTF-8 (límite de bcrypt), sin reglas de composición. Se rechazan contraseñas comunes, basadas en el nombre o el correo, y las expuestas en filtraciones (Have I Been Pwned, k-anonimato)."
                  }
                }
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Cuenta creada y sesión abierta",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "accessToken": {
                      "type": "string",
                      "description": "JWT de 15 minutos. Guardarlo SOLO en memoria y enviarlo como Authorization: Bearer <token>."
                    },
                    "expiraEn": {
                      "type": "string",
                      "format": "date-time"
                    },
                    "usuario": {
                      "type": "object",
                      "properties": {
                        "idUsuario": {
                          "type": "integer",
                          "example": 3
                        },
                        "idPersona": {
                          "type": "integer",
                          "example": 3
                        },
                        "nombres": {
                          "type": "string",
                          "example": "Rosa"
                        },
                        "apellidos": {
                          "type": "string",
                          "example": "Vera Chávez"
                        },
                        "correo": {
                          "type": "string",
                          "example": "rosa.vera@correo.com"
                        },
                        "fotoUrl": {
                          "type": "string",
                          "nullable": true,
                          "example": null
                        },
                        "roles": {
                          "type": "array",
                          "items": {
                            "type": "string",
                            "enum": [
                              "ESTUDIANTE",
                              "DOCENTE",
                              "ADMIN"
                            ]
                          }
                        }
                      }
                    }
                  }
                }
              }
            },
            "headers": {
              "Set-Cookie": {
                "description": "`learnity_rt` (refresh token opaco, HttpOnly, SameSite=Lax, Path=/api/auth, Secure en HTTPS) y `XSRF-TOKEN` (token CSRF legible por JavaScript).",
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "400": {
            "description": "Datos inválidos o contraseña rechazada por la política. También, sin detalles, si el cuerpo no es un JSON válido (SOLICITUD_INVALIDA)",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorApi"
                }
              }
            }
          },
          "403": {
            "description": "Origen no permitido (ORIGEN_NO_PERMITIDO)",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorApi"
                }
              }
            }
          },
          "409": {
            "description": "Correo ya registrado",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorApi"
                }
              }
            }
          },
          "413": {
            "$ref": "#/components/responses/CuerpoDemasiadoGrande"
          },
          "415": {
            "$ref": "#/components/responses/TipoNoAdmitido"
          },
          "429": {
            "description": "Demasiadas peticiones desde esta IP (DEMASIADAS_PETICIONES, encabezado Retry-After)",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorApi"
                }
              }
            }
          },
          "500": {
            "$ref": "#/components/responses/ErrorInterno"
          }
        }
      }
    },
