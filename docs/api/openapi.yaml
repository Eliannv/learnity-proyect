          "campo",
          "mensaje"
        ],
        "properties": {
          "campo": {
            "type": "string",
            "description": "Ruta del campo con puntos (`objetivos.0`); vacía si el problema es del cuerpo entero."
          },
          "mensaje": {
            "type": "string"
          }
        }
      },
      "ErrorApi": {
        "type": "object",
        "required": [
          "error"
        ],
        "properties": {
          "error": {
            "type": "object",
            "required": [
              "codigo",
              "mensaje"
            ],
            "properties": {
              "codigo": {
                "type": "string",
                "example": "SOLICITUD_INVALIDA",
                "description": "Código estable para el cliente: SOLICITUD_INVALIDA, NO_AUTENTICADO, TOKEN_INVALIDO, SESION_REVOCADA, SIN_PERMISO, NO_ENCONTRADO, CONFLICTO, CURSO_BLOQUEADO, DEMASIADAS_PETICIONES, CUERPO_DEMASIADO_GRANDE, TIPO_NO_ADMITIDO, ERROR_INTERNO y los propios de cada operación."
              },
              "mensaje": {
                "type": "string",
                "description": "Texto para mostrar a la persona usuaria."
              },
              "detalles": {
                "description": "Opcional. Una lista de problemas por campo (errores de validación 400, 409 CURSO_INCOMPLETO y algunos 413 y 415 de la subida de PDF); `{ reintentarEnSegundos }` en el 429; un texto con el error original en el 500, solo con `NODE_ENV=development`. En los demás casos no se envía (por ejemplo, en el 409 CONFLICTO de PostgreSQL).",
                "oneOf": [
                  {
                    "type": "array",
                    "items": {
                      "$ref": "#/components/schemas/ProblemaCampo"
                    }
                  },
                  {
                    "type": "object",
                    "required": [
                      "reintentarEnSegundos"
                    ],
                    "properties": {
                      "reintentarEnSegundos": {
                        "type": "integer",
                        "minimum": 1
                      }
                    }
                  },
                  {
                    "type": "string"
                  }
                ]
              }
            }
          }
        }
      },
