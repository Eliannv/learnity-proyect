      "get": {
        "tags": [
          "Cursos"
        ],
        "summary": "Catálogo público: solo cursos publicados",
        "description": "Los valores repetidos de categoría o nivel se combinan con OR dentro del grupo y AND entre grupos. La búsqueda consulta título, subtítulo y descripción. El total solo cuenta publicados y `totalPaginas` vale 0 si no hay resultados. El catálogo no excluye los cursos de categorías inactivas ni de docentes inactivos. Un parámetro de consulta desconocido da 400.",
        "parameters": [
          {
            "in": "query",
            "name": "q",
            "description": "Se recortan los espacios; vacío no filtra.",
            "schema": {
              "type": "string",
              "maxLength": 100
            }
          },
          {
            "in": "query",
            "name": "categoria",
            "description": "Nombre exacto; repetible.",
            "schema": {
              "type": "array",
              "maxItems": 20,
              "items": {
                "type": "string",
                "minLength": 1,
                "maxLength": 80
              }
            },
            "style": "form",
            "explode": true
          },
          {
            "in": "query",
            "name": "nivel",
            "description": "Repetible.",
            "schema": {
              "type": "array",
              "maxItems": 20,
              "items": {
                "type": "string",
                "enum": [
                  "PRINCIPIANTE",
                  "INTERMEDIO",
                  "AVANZADO"
                ]
              }
            },
            "style": "form",
            "explode": true
          },
          {
            "in": "query",
            "name": "orden",
            "schema": {
              "type": "string",
              "enum": [
                "recientes",
                "populares",
                "az"
              ],
              "default": "recientes"
            }
          },
          {
            "in": "query",
            "name": "pagina",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 10000,
              "default": 1
            }
          },
          {
            "in": "query",
            "name": "limite",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 50,
              "default": 9
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Correcto",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "items",
                    "pagina",
                    "limite",
                    "total",
                    "totalPaginas"
                  ],
                  "properties": {
                    "items": {
                      "type": "array",
                      "items": {
                        "$ref": "#/components/schemas/CursoPublico"
                      }
                    },
                    "pagina": {
                      "type": "integer"
                    },
                    "limite": {
                      "type": "integer"
                    },
                    "total": {
                      "type": "integer"
                    },
                    "totalPaginas": {
                      "type": "integer"
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Filtros o paginación inválidos",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorApi"
                }
              }
            }
          },
          "500": {
            "$ref": "#/components/responses/ErrorInterno"
          }
        }
      }
