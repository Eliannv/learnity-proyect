    "/auth/restablecer": {
      "post": {
        "tags": [
          "Identidad"
        ],
        "summary": "RF-06 · Guardar la nueva contraseña con el token del enlace",
        "description": "Consume el enlace (un solo uso), cambia la contraseña y revoca todas las sesiones anteriores de la cuenta.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "token",
                  "contrasena"
                ],
                "properties": {
                  "token": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 100,
                    "description": "Valor tras #token= en el enlace del correo"
                  },
                  "contrasena": {
                    "type": "string",
                    "minLength": 15,
                    "description": "Mínimo 15 caracteres y máximo 72 bytes UTF-8 (límite de bcrypt), sin reglas de composición. Se rechazan contraseñas comunes, basadas en el nombre o el correo, y las expuestas en filtraciones (Have I Been Pwned, k-anonimato)."
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Correcto",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "mensaje": {
                      "type": "string"
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Enlace inválido, usado o vencido, o contraseña rechazada. También, sin detalles, si el cuerpo no es un JSON válido (SOLICITUD_INVALIDA)",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorApi"
                }
              }
            }
          },
          "403": {
            "description": "Origen no permitido (ORIGEN_NO_PERMITIDO)",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorApi"
                }
              }
            }
          },
          "413": {
            "$ref": "#/components/responses/CuerpoDemasiadoGrande"
          },
          "415": {
            "$ref": "#/components/responses/TipoNoAdmitido"
          },
          "429": {
            "description": "Demasiadas peticiones desde esta IP (DEMASIADAS_PETICIONES, encabezado Retry-After)",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorApi"
                }
              }
            }
          },
          "500": {
            "$ref": "#/components/responses/ErrorInterno"
          }
        }
      }
    },
